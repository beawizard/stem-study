<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>STEM Study</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="App.navigate('home')">STEM Study</div>
      <nav id="nav" class="nav hidden">
        <button type="button" data-route="home">Home</button>
        <button type="button" data-route="study">Study</button>
        <button type="button" data-route="tasks">Tasks</button>
        <button type="button" data-route="insights">Insights</button>
        <button type="button" data-route="account">Account</button>
        <button type="button" id="btn-logout" class="ghost">Log out</button>
      </nav>
    </header>

    <main id="main" class="main">
      <!-- views injected by app.js -->
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script>
    // Filled after CDK deploy (or override for local).
    window.STEM_CONFIG = {
      apiUrl: "",           // e.g. https://xxxx.execute-api.ap-southeast-1.amazonaws.com
      userPoolId: "",
      userPoolClientId: "",
      region: "ap-southeast-1",
      gcashMerchant: "09XX-XXX-XXXX",
      monthlyPricePhp: 99
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
