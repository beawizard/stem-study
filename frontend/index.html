<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0f766e" />
  <title>MElon Basic Education</title>
  <!-- ?v= busts mobile/Safari cache when assets change -->
  <link rel="stylesheet" href="css/styles.css?v=20260725f" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-block" onclick="App.navigate('home')">
        <div class="brand">
          <span class="brand-name">MElon</span>
          <span class="brand-sub">Basic</span>
          <span class="brand-sub">Education</span>
        </div>
        <div class="brand-tagline">Learning is fun</div>
      </div>
      <nav id="nav" class="nav hidden">
        <button type="button" data-route="home">Home</button>
        <button type="button" data-route="study">Study</button>
        <button type="button" data-route="insights">Insights</button>
        <button type="button" data-route="admin" id="nav-admin" class="hidden admin-nav">Admin</button>
        <div class="nav-profile" id="nav-profile">
          <button type="button" class="nav-profile-btn" id="btn-profile-menu"
            aria-haspopup="true" aria-expanded="false" aria-controls="nav-profile-dropdown"
            title="Profile menu" aria-label="Profile menu">
            <span class="nav-profile-avatar" id="nav-profile-avatar" aria-hidden="true">
              <img id="nav-profile-img" class="nav-profile-img hidden" alt="" />
              <span class="nav-profile-placeholder" id="nav-profile-placeholder">
                <svg class="nav-profile-user-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5" fill="currentColor"/>
                  <path fill="currentColor" d="M5.5 19.2c.6-3.2 3.2-5.2 6.5-5.2s5.9 2 6.5 5.2c.1.5-.3 1-0.8 1H6.3c-.5 0-.9-.5-.8-1z"/>
                </svg>
              </span>
              <span class="nav-profile-initials hidden" id="nav-profile-initials"></span>
            </span>
          </button>
          <div class="nav-profile-dropdown hidden" id="nav-profile-dropdown" role="menu">
            <button type="button" role="menuitem" data-profile-action="account">Account</button>
            <button type="button" role="menuitem" data-profile-action="profile">Profile</button>
            <button type="button" role="menuitem" data-profile-action="logout" class="nav-profile-logout">Logout</button>
          </div>
        </div>
      </nav>
    </header>

    <main id="main" class="main">
      <!-- views injected by app.js -->
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script>
    // Filled after CDK deploy (or override for local).
    window.STEM_CONFIG = {
      apiUrl: "https://6bg1skwdm6.execute-api.ap-southeast-1.amazonaws.com",
      userPoolId: "ap-southeast-1_h3BqT4uTs",
      userPoolClientId: "58jh5ljjcnp3pmjccj9tu895gm",
      region: "ap-southeast-1",
      gcashMerchant: "09XX-XXX-XXXX",
      monthlyPricePhp: 99
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <!-- SheetJS for multi-sheet Excel import in Admin -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/api.js?v=20260725d"></script>
  <script src="js/auth.js?v=20260719v"></script>
  <script src="js/app.js?v=20260725f"></script>
</body>
</html>
